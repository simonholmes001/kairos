name: Azure IaC Lint

on:
  push:
    branches: [main, "feature/**", "platform/**"]
    paths:
      - "infrastructure/**"
      - ".github/workflows/iac-lint.yaml"
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/**"
      - ".github/workflows/iac-lint.yaml"

jobs:
  bicep-lint:
    name: Bicep Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Kairos IaC
        shell: bash
        run: |
          if [ -x ./infrastructure/scripts/guard-tests.sh ]; then
            bash ./infrastructure/scripts/guard-tests.sh
          fi
          if [ -x ./infrastructure/scripts/validate.sh ]; then
            bash ./infrastructure/scripts/validate.sh dev --lint-only
          elif find infrastructure -name '*.bicep' -print -quit | grep -q .; then
            while IFS= read -r file; do
              az bicep build --file "$file"
            done < <(find infrastructure -name '*.bicep' | sort)
          else
            echo "No Kairos IaC files found; skipping."
          fi
