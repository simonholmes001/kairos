name: Azure Infrastructure Validate (PR)

on:
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/**"
      - ".github/workflows/infrastructure-validate.yaml"

permissions:
  contents: read
  id-token: write

jobs:
  validate-dev:
    name: Validate Dev Infrastructure
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Detect Kairos infrastructure
        id: detect
        shell: bash
        run: |
          if [ -d infrastructure ] && { [ -x infrastructure/scripts/validate.sh ] || find infrastructure -name '*.bicep' -print -quit | grep -q .; }; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Kairos infrastructure is not present yet; Azure validation is skipped."
          fi

      - name: Run infrastructure guard tests
        if: steps.detect.outputs.exists == 'true'
        shell: bash
        run: |
          if [ -x ./infrastructure/scripts/guard-tests.sh ]; then
            bash ./infrastructure/scripts/guard-tests.sh
          fi

      - name: Lint Kairos infrastructure
        if: steps.detect.outputs.exists == 'true'
        shell: bash
        run: |
          if [ -x ./infrastructure/scripts/validate.sh ]; then
            bash ./infrastructure/scripts/validate.sh dev --lint-only
          else
            for file in $(find infrastructure -name '*.bicep'); do
              az bicep build --file "$file"
            done
          fi

      - name: Login to Azure (OIDC)
        if: steps.detect.outputs.exists == 'true'
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Kairos infrastructure
        if: steps.detect.outputs.exists == 'true'
        shell: bash
        run: |
          if [ -x ./infrastructure/scripts/validate.sh ]; then
            bash ./infrastructure/scripts/validate.sh dev
          else
            echo "No validate.sh present; lint-only Bicep validation completed."
          fi

      - name: Run Kairos infrastructure what-if
        if: steps.detect.outputs.exists == 'true'
        shell: bash
        run: |
          if [ -x ./infrastructure/scripts/validate.sh ]; then
            bash ./infrastructure/scripts/validate.sh dev --what-if
          else
            echo "No validate.sh present; what-if skipped."
          fi
